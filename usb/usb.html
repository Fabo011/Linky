<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copy to Clipboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 600px;
        }
        .field {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        textarea {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            color: transparent;
            text-shadow: 0 0 8px #ccc;
        }
        button {
            padding: 8px 12px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #toast {
            visibility: hidden;
            min-width: 150px;
            background-color: #333;
            color: #fff;
            text-align: center;
            border-radius: 4px;
            padding: 10px;
            position: fixed;
            z-index: 1;
            right: 30px;
            bottom: 30px;
            font-size: 14px;
        }
        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }
        @keyframes fadein {
            from {bottom: 0; opacity: 0;}
            to {bottom: 30px; opacity: 1;}
        }
        @keyframes fadeout {
            from {bottom: 30px; opacity: 1;}
            to {bottom: 0; opacity: 0;}
        }
    </style>
</head>
<body>
    <h1>Copy Values to Clipboard</h1>
    <div class="container">
        <div class="field">
            <label for="username">Username:</label>
            <textarea id="username" readonly>my_username</textarea>
            <button onclick="copyToClipboard('username')">Copy</button>
        </div>
        <div class="field">
            <label for="password">Password:</label>
            <textarea id="password" readonly>my_password</textarea>
            <button onclick="copyToClipboard('password')">Copy</button>
        </div>
        <div class="field">
            <label for="digitalKey">DigitalKey:</label>
            <textarea id="digitalKey" readonly>my_digital_key</textarea>
            <button onclick="copyToClipboard('digitalKey')">Copy</button>
        </div>
        <div class="field">
            <label for="certificate">Certificate:</label>
            <textarea id="certificate" readonly>my_certificate_content</textarea>
            <button onclick="copyToClipboard('certificate')">Copy</button>
        </div>
    </div>
    <div id="toast"></div>

    <script>
        function copyToClipboard(id) {
            const textarea = document.getElementById(id);
            textarea.select();
            document.execCommand('copy');
            showToast();
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.className = "show";
            toast.textContent = "Copied!";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
        }
    </script>
</body>
</html>
